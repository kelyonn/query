 x1="992" y1="420" x2="992" y2="416" stroke="#4f5d75" stroke-opacity=".5"/><line x1="1008" y1="420" x2="1008" y2="416" stroke="#4f5d75" stroke-opacity=".5"/><line x1="1024" y1="420" x2="1024" y2="410" stroke="#4f5d75" stroke-opacity=".5"/><line x1="1040" y1="420" x2="1040" y2="416" stroke="#4f5d75" stroke-opacity=".5"/><line x1="1056" y1="420" x2="1056" y2="416" stroke="#4f5d75" stroke-opacity=".5"/><line x1="1072" y1="420" x2="1072" y2="416" stroke="#4f5d75" stroke-opacity=".5"/><line x1="1088" y1="420" x2="1088" y2="416" stroke="#4f5d75" stroke-opacity=".5"/><line x1="1104" y1="420" x2="1104" y2="416" stroke="#4f5d75" stroke-opacity=".5"/><line x1="1120" y1="420" x2="1120" y2="416" stroke="#4f5d75" stroke-opacity=".5"/><line x1="1136" y1="420" x2="1136" y2="416" stroke="#4f5d75" stroke-opacity=".5"/><line x1="1152" y1="420" x2="1152" y2="410" stroke="#4f5d75" stroke-opacity=".5"/><line x1="1168" y1="420" x2="1168" y2="416" stroke="#4f5d75" stroke-opacity=".5"/><line x1="1184" y1="420" x2="1184" y2="416" stroke="#4f5d75" stroke-opacity=".5"/><line x1="1200" y1="420" x2="1200" y2="416" stroke="#4f5d75" stroke-opacity=".5"/><line x1="1216" y1="420" x2="1216" y2="416" stroke="#4f5d75" stroke-opacity=".5"/><line x1="1232" y1="420" x2="1232" y2="416" stroke="#4f5d75" stroke-opacity=".5"/><line x1="1248" y1="420" x2="1248" y2="416" stroke="#4f5d75" stroke-opacity=".5"/><line x1="1264" y1="420" x2="1264" y2="416" stroke="#4f5d75" stroke-opacity=".5"/><line x1="1280" y1="420" x2="1280" y2="410" stroke="#4f5d75" stroke-opacity=".5"/><text x="64.0" y="52.0" font-family="M" font-size="13" fill="#4f5d75" text-anchor="start" letter-spacing="1.5" >KELYONN / QUERY</text><text x="1240.0" y="52.0" font-family="M" font-size="13" fill="#60a5fa" text-anchor="end" letter-spacing="1.5" >CHINOOK · POSTGRES</text><text x="58.0" y="214.0" font-family="D" font-size="128" fill="#eaf1fb" text-anchor="start" letter-spacing="-4" >Query</text><text x="64.0" y="262.0" font-family="M" font-size="19" fill="#eaf1fb" text-anchor="start" letter-spacing="0" fill-opacity=".86">Ask your database a question in English.</text><text x="64.0" y="290.0" font-family="M" font-size="19" fill="#eaf1fb" text-anchor="start" letter-spacing="0" fill-opacity=".86">Get the SQL, the table and the chart.</text><text x="64.0" y="386.0" font-family="MB" font-size="12" fill="#4f5d75" text-anchor="start" letter-spacing="1.6" >PYTHON  /  LANGCHAIN  /  STREAMLIT  /  POSTGRESQL  /  OPENAI</text><rect x="750" y="62" width="460" height="40" rx="20" fill="#111a2a" stroke="#24324c"/><text x="770.0" y="87.0" font-family="M" font-size="14" fill="#eaf1fb" text-anchor="start" letter-spacing="0" clip-path="url(#qt)">What are the top 5 selling genres?</text><g class="sq" style="animation-delay:1.60s"><text x="754.0" y="130.0" font-family="M" font-size="12" fill="#8fb4e6" text-anchor="start" letter-spacing="0" >SELECT g.name, SUM(il.quantity) AS sold</text></g><g class="sq" style="animation-delay:1.85s"><text x="754.0" y="148.0" font-family="M" font-size="12" fill="#8fb4e6" text-anchor="start" letter-spacing="0" >FROM invoice_line il</text></g><g class="sq" style="animation-delay:2.10s"><text x="754.0" y="166.0" font-family="M" font-size="12" fill="#8fb4e6" text-anchor="start" letter-spacing="0" >JOIN track t ON t.track_id = il.track_id</text></g><g class="sq" style="animation-delay:2.35s"><text x="754.0" y="184.0" font-family="M" font-size="12" fill="#8fb4e6" text-anchor="start" letter-spacing="0" >JOIN genre g ON g.genre_id = t.genre_id</text></g><g class="sq" style="animation-delay:2.60s"><text x="754.0" y="202.0" font-family="M" font-size="12" fill="#8fb4e6" text-anchor="start" letter-spacing="0" >GROUP BY g.name ORDER BY sold DESC LIMIT 5;</text></g><text x="846.0" y="251.0" font-family="M" font-size="12" fill="#aebfd8" text-anchor="end" letter-spacing="0" >Rock</text><rect class="bar" style="animation-delay:3.00s" x="856" y="238" width="300" height="17" rx="2" fill="#60a5fa" fill-opacity="1.00"/><g class="sq" style="animation-delay:3.40s"><text x="1164.0" y="251.0" font-family="M" font-size="11" fill="#aebfd8" text-anchor="start" letter-spacing="0" >835</text></g><text x="846.0" y="277.0" font-family="M" font-size="12" fill="#aebfd8" text-anchor="end" letter-spacing="0" >Latin</text><rect class="bar" style="animation-delay:3.12s" x="856" y="264" width="139" height="17" rx="2" fill="#60a5fa" fill-opacity="0.86"/><g class="sq" style="animation-delay:3.52s"><text x="1002.7" y="277.0" font-family="M" font-size="11" fill="#aebfd8" text-anchor="start" letter-spacing="0" >386</text></g><text x="846.0" y="303.0" font-family="M" font-size="12" fill="#aebfd8" text-anchor="end" letter-spacing="0" >Metal</text><rect class="bar" style="animation-delay:3.24s" x="856" y="290" width="95" height="17" rx="2" fill="#60a5fa" fill-opacity="0.72"/><g class="sq" style="animation-delay:3.64s"><text x="958.9" y="303.0" font-family="M" font-size="11" fill="#aebfd8" text-anchor="start" letter-spacing="0" >264</text></g><text x="846.0" y="329.0" font-family="M" font-size="12" fill="#aebfd8" text-anchor="end" letter-spacing="0" >Alt &amp; Punk</text><rect class="bar" style="animation-delay:3.36s" x="856" y="316" width="88" height="17" rx="2" fill="#60a5fa" fill-opacity="0.58"/><g class="sq" style="animation-delay:3.76s"><text x="951.7" y="329.0" font-family="M" font-size="11" fill="#aebfd8" text-anchor="start" letter-spacing="0" >244</text></g><text x="846.0" y="355.0" font-family="M" font-size="12" fill="#aebfd8" text-anchor="end" letter-spacing="0" >Jazz</text><rect class="bar" style="animation-delay:3.48s" x="856" y="342" width="29" height="17" rx="2" fill="#60a5fa" fill-opacity="0.44"/><g class="sq" style="animation-delay:3.88s"><text x="892.7" y="355.0" font-family="M" font-size="11" fill="#aebfd8" text-anchor="start" letter-spacing="0" >80</text></g></svg>